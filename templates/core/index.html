<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, serif;
            background: #fdf8f0;
            color: #4a3728;
        }
        .container { text-align: center; padding: 2rem; }
        h1 { font-size: 3rem; font-weight: normal; letter-spacing: 0.1em; margin-bottom: 1rem; }
        p { font-size: 1.2rem; color: #8a6d5e; }
        .rsvp-btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.8rem 2.5rem;
            font-family: Georgia, serif;
            font-size: 1rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #fdf8f0;
            background: #4a3728;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .rsvp-btn:hover { background: #8a6d5e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Coming Soon</h1>
        <p>Wir freuen uns auf euch.</p>
        <a href="#" class="rsvp-btn">RSVP</a>
    </div>
</body>
</html>
